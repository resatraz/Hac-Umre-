name: hac_umre_rehberi
description: "Adım adım Hac ve Umre rehberi - offline harita, ziyaret yerleri, dualar ve sesli rehber"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.0.0
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  geolocator: ^13.0.4
  http: ^1.6.0
  flutter_local_notifications: ^18.0.1
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  timezone: ^0.10.1
  easy_localization: ^3.0.7
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/audio/hac_umre/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
